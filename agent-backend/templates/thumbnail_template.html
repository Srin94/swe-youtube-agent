<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --canvas-bg: __CANVAS_BG__;
        --canvas-bg2: __CANVAS_BG2__;
        --card-bg: __CARD_BG__;
        --grid: __GRID__;
        --text-primary: __TEXT_PRIMARY__;
        --text-muted: __TEXT_MUTED__;
        --accent: __ACCENT__;
        --accent-2: __ACCENT_2__;
        --accent-critical: __ACCENT_CRITICAL__;
        --font-heading: __FONT_HEADING__;
        --font-mono: __FONT_MONO__;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; }

      body {
        position: relative;
        background:
          radial-gradient(60% 80% at 82% 18%, __ACCENT_GLOW__ 0%, transparent 60%),
          radial-gradient(70% 90% at 12% 110%, __ACCENT2_GLOW__ 0%, transparent 55%),
          linear-gradient(135deg, var(--canvas-bg2) 0%, var(--canvas-bg) 60%);
        font-family: var(--font-heading);
        color: var(--text-primary);
        overflow: hidden;
      }
      /* faint dot grid */
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(var(--grid) 1.5px, transparent 1.5px);
        background-size: 34px 34px;
        opacity: 0.5;
      }
      /* bold diagonal accent streak for energy */
      .streak {
        position: absolute; top: -200px; right: 300px;
        width: 160px; height: 1200px;
        background: linear-gradient(var(--accent), transparent);
        transform: rotate(24deg);
        opacity: 0.10;
      }
      /* darken bottom for text legibility */
      .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(120% 120% at 30% 40%, transparent 45%, rgba(0,0,0,0.55) 100%);
      }

      .layout {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: center;
        padding: 64px 70px;
        gap: 40px;
      }

      .left { display: flex; flex-direction: column; gap: 26px; }

      .badge {
        align-self: flex-start;
        display: inline-flex; align-items: center; gap: 12px;
        background: var(--accent-critical);
        color: #fff;
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 24px;
        letter-spacing: 3px;
        text-transform: uppercase;
        padding: 10px 22px;
        border-radius: 6px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      }
      .badge::before {
        content: ""; width: 12px; height: 12px; border-radius: 50%;
        background: #fff; box-shadow: 0 0 12px #fff;
      }

      .headline {
        font-size: 104px;
        line-height: 0.95;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -2px;
        max-width: 760px;
      }
      .headline .hl {
        display: inline-block;
        background: var(--accent);
        color: #06080f;
        padding: 0 16px;
        border-radius: 10px;
        margin-top: 10px;
        box-shadow: 0 0 40px __ACCENT_GLOW__;
        transform: rotate(-1.5deg);
      }

      .brand {
        display: flex; align-items: center; gap: 14px;
        margin-top: 8px;
      }
      .brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
      .brand .name {
        font-family: var(--font-mono);
        font-size: 24px; letter-spacing: 5px; font-weight: 700;
        text-transform: uppercase; color: var(--text-muted);
      }

      /* Right-hand icon composition */
      .right { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .icon-tile {
        width: 210px; height: 210px;
        background: var(--card-bg);
        border: 2px solid var(--accent);
        border-radius: 28px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 50px __ACCENT_GLOW__, inset 0 0 40px rgba(255,255,255,0.03);
        position: relative;
      }
      .icon-tile.alt { border-color: var(--accent-2); box-shadow: 0 0 50px __ACCENT2_GLOW__, inset 0 0 40px rgba(255,255,255,0.03); }
      .icon-tile img, .icon-tile svg { width: 128px; height: 128px; }
      .icon-tile .fallback { font-size: 104px; font-weight: 900; color: var(--text-primary); }

      .connector {
        font-size: 72px; font-weight: 900; line-height: 1;
        color: var(--accent);
        text-shadow: 0 0 30px __ACCENT_GLOW__;
      }
      .connector.critical { color: var(--accent-critical); text-shadow: 0 0 30px rgba(255,42,84,0.5); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="streak"></div>
    <div class="vignette"></div>

    <div class="layout">
      <div class="left">
        <div class="badge">__BADGE_TEXT__</div>
        <div class="headline">__HEADLINE_HTML__</div>
        <div class="brand">
          <div class="dot"></div>
          <div class="name">__CHANNEL_NAME__</div>
        </div>
      </div>

      <div class="right">
        <div class="icon-tile">__LEFT_ICON__</div>
        <div class="connector __CONNECTOR_CLASS__">__CONNECTOR_GLYPH__</div>
        <div class="icon-tile alt">__RIGHT_ICON__</div>
      </div>
    </div>
  </body>
</html>
