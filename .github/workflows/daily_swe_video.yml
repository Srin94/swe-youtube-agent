name: Daily SWE YouTube Video Agent

on:
  schedule:
    - cron: '33 5 * * *' # Runs daily at 05:33 UTC (11:03 AM IST). Odd minute,
      # off the busy :00/:30 marks, so GitHub is far less likely to delay/drop it.
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom SWE topic (leave blank for automatic daily trend discovery)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    # Must comfortably exceed render time + APPROVAL_WINDOW_MINUTES below, or the
    # runner is killed mid-wait before you can tap Approve.
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Audio & Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent-backend/requirements.txt

      - name: Install Python Packages & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-backend/requirements.txt
          playwright install --with-deps chromium

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: video-engine/package.json

      - name: Install Remotion Video Engine Dependencies
        run: |
          cd video-engine
          npm install

      - name: Execute End-to-End Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # The job polls for your Telegram Approve/Cancel tap for this long. The
          # runner is billed for the whole wait, so keep the repo public (free,
          # unlimited minutes) or keep this window short. Stays under the job's
          # timeout-minutes so render + wait never gets killed mid-approval.
          APPROVAL_WINDOW_MINUTES: "60"
          # Fail-closed: no tap within the window => nothing is published.
          APPROVE_ON_TIMEOUT: "false"
        run: |
          cd agent-backend
          if [ -n "${{ github.event.inputs.custom_topic }}" ]; then
            python main.py --topic "${{ github.event.inputs.custom_topic }}"
          else
            python main.py
          fi

      # Keep the render outputs even when the run isn't approved/published, so the
      # thumbnail and video are downloadable from the run page (the runner is wiped
      # otherwise). if: always() => captured on failure/timeout/cancel too.
      - name: Upload Render Artifacts (thumbnail + video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-outputs
          path: |
            agent-backend/output/thumbnail.png
            agent-backend/output/thumbnail_filled.html
            agent-backend/output/final_video.mp4
            agent-backend/output/render_payload.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit Updated SQLite Deduplication Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agent-backend/data/seen_topics.db
          git diff --staged --quiet || git commit -m "chore: record published SWE topic in seen_topics.db [skip ci]"
          git push
